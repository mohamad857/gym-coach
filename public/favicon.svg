<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#1A233A"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neon)" stroke-width="6" opacity="0.4"/>
  
  <!-- Dumbbell & AI Bolt Icon -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Dumbbell Bar -->
    <rect x="196" y="236" width="120" height="40" rx="8" fill="url(#neon)"/>
    
    <!-- Left Weight Plates -->
    <rect x="140" y="166" width="46" height="180" rx="12" fill="url(#neon)"/>
    <rect x="96" y="196" width="36" height="120" rx="10" fill="url(#neon)" opacity="0.8"/>
    
    <!-- Right Weight Plates -->
    <rect x="326" y="166" width="46" height="180" rx="12" fill="url(#neon)"/>
    <rect x="380" y="196" width="36" height="120" rx="10" fill="url(#neon)" opacity="0.8"/>
  </g>
  
  <!-- Energy Sparkle / AI Bolt in Center -->
  <circle cx="256" cy="256" r="32" fill="#10B981" filter="url(#glow)"/>
  <path d="M256 226 L262 250 L286 256 L262 262 L256 286 L250 262 L226 256 L250 250 Z" fill="#FFFFFF"/>
</svg>

